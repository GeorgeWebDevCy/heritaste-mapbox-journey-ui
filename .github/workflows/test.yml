name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './plugin-update-checker/*' -print0 | xargs -0 -n1 php -l
      - name: Verify updater integration
        run: php tests/verify-updater.php
