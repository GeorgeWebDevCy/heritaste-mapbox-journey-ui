name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify updater integration
        run: php tests/verify-updater.php
      - name: Verify journey map integration
        run: php tests/verify-journey-map.php
      - name: Verify tag matches plugin version
        shell: bash
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' heritaste-mapbox-journey-ui.php | head -n1)
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build plugin ZIP
        shell: bash
        run: |
          mkdir -p build/heritaste-mapbox-journey-ui
          rsync -a ./ build/heritaste-mapbox-journey-ui/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'tests/'
          cd build
          zip -qr heritaste-mapbox-journey-ui.zip heritaste-mapbox-journey-ui
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/heritaste-mapbox-journey-ui.zip --generate-notes --verify-tag
